# =============================================================================
# TUGRR ADMIN PORTAL CI/CD PIPELINE
# =============================================================================
# Enterprise-grade pipeline for the Admin Portal monorepo:
#   - server/  : TypeScript API (Express) → PM2 process `admin-server` on :8446
#   - client/  : React + Vite SPA → static build published to the web root
#
# TRIGGERS:
#   - Push to master or develop → full pipeline (+ deploy on master)
#   - Pull request to master or develop → quality gates only (no deploy)
#   - Manual dispatch → full pipeline with optional deploy
#
# QUALITY GATES (run for BOTH server and client):
#   1. Deterministic install (npm ci)
#   2. TypeScript strict type-check
#   3. Production build
#   4. ESLint (client) / security audit
#   5. Secret scanning
#
# DEPLOYMENT (master only, mirror-server style):
#   - SSH into the production host
#   - git reset --hard origin/master
#   - Build + PM2 hard-restart `admin-server`
#   - Build + publish the client to the web root
#   - PM2 online verification + HTTP health check with automatic rollback
#   - Git tag + GitHub Release on success
#
# REQUIRED GITHUB SECRETS:
#   SERVER_HOST        production host (shared with mirror-server)
#   SERVER_USER        SSH user (shared)
#   SERVER_SSH_KEY     private deploy key (shared)
#   ADMIN_DEPLOY_PATH  repo checkout on the host (e.g. /var/www/admin) — this is
#                      ALSO the nginx web root that the client publishes into.
#
# WHY pm2 restart vs reload:
#   `restart` is a hard kill + respawn. The Admin API is a single stateless
#   process, so the sub-second gap is invisible behind nginx + client retry,
#   and a hard restart avoids any stuck state a graceful reload might leave.
# =============================================================================

name: Admin Portal CI/CD

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Force deploy to production'
        required: false
        type: boolean
        default: false

# Prevent concurrent deployments — queue new runs, cancel redundant PR checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'

jobs:
  # ===========================================================================
  # JOB 1: QUALITY GATES
  # ===========================================================================
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      # ---- Server ----------------------------------------------------------
      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Server type-check (strict)
        working-directory: server
        run: npx tsc --noEmit

      - name: Build server
        working-directory: server
        run: npm run build

      - name: Verify server build artifacts
        working-directory: server
        run: |
          if [ ! -f "dist/index.js" ]; then
            echo "::error::Server build failed — server/dist/index.js not found"
            exit 1
          fi
          echo "Server build artifacts verified:"
          ls -la dist/

      - name: Server security audit
        working-directory: server
        run: npm audit --audit-level=high
        continue-on-error: true

      # ---- Client ----------------------------------------------------------
      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Lint client
        working-directory: client
        run: npm run lint
        continue-on-error: true

      - name: Build client
        working-directory: client
        run: npm run build

      - name: Verify client build artifacts
        working-directory: client
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "::error::Client build failed — client/dist/index.html not found"
            exit 1
          fi
          echo "Client build artifacts verified:"
          ls -la dist/

      - name: Client security audit
        working-directory: client
        run: npm audit --audit-level=high
        continue-on-error: true

      # ---- Repo-wide -------------------------------------------------------
      - name: Scan for secrets in code
        run: |
          echo "Scanning for potential secrets..."
          PATTERNS='(password|secret|api_key|private_key|token)\s*[:=]\s*["\x27][^"\x27]{8,}'
          if grep -rniE "$PATTERNS" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" \
            --exclude-dir=node_modules --exclude-dir=dist \
            --exclude="package-lock.json" --exclude="*.d.ts" . ; then
            echo "::warning::Potential hardcoded secrets detected. Review the matches above."
          else
            echo "No hardcoded secrets detected."
          fi

  # ===========================================================================
  # JOB 2: DEPLOY TO PRODUCTION
  # ===========================================================================
  deploy:
    name: Deploy to Production
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true')

    environment:
      name: production
      url: https://www.theundergroundrailroad.world/admin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Create pre-deploy snapshot
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'DEPLOY_SNAPSHOT'
          cd ${{ secrets.ADMIN_DEPLOY_PATH }}

          # Tag current state for rollback
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "Pre-deploy commit: $CURRENT_COMMIT"
          echo "$CURRENT_COMMIT" > /tmp/.admin-portal-rollback-commit
          DEPLOY_SNAPSHOT

      - name: Deploy admin portal
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'DEPLOY_SCRIPT'
          set -e

          echo "=========================================="
          echo "  ADMIN PORTAL DEPLOYMENT"
          echo "  $(date '+%Y-%m-%d %H:%M:%S')"
          echo "=========================================="

          cd ${{ secrets.ADMIN_DEPLOY_PATH }}

          # Step 1: Pull latest code
          echo "[1/6] Pulling latest code..."
          git fetch origin master
          git reset --hard origin/master

          # Step 2: Build + restart the server
          echo "[2/6] Building server..."
          cd server
          npm ci
          npm run build
          if [ ! -f "dist/index.js" ]; then
            echo "ERROR: Server build failed — dist/index.js missing!"
            exit 1
          fi

          echo "[3/6] Pruning server dev dependencies..."
          npm prune --omit=dev

          echo "[4/6] Restarting admin-server (PM2)..."
          sudo pm2 restart ecosystem.config.js

          # Step 5: Build + publish the client to the web root
          echo "[5/6] Building & publishing client..."
          cd ../client
          npm ci
          npm run deploy   # rebuild + copy dist/* into the web root

          # Step 6: Status
          echo "[6/6] Deploy complete. Waiting for stabilization..."
          cd ..
          sleep 8
          sudo pm2 list
          DEPLOY_SCRIPT

      - name: Verify admin-server is online
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'PM2_CHECK'
          set -e
          OFFLINE=$(sudo pm2 jlist | python3 -c "
          import json, sys
          procs = json.load(sys.stdin)
          expected = {'admin-server'}
          alive = {p['name'] for p in procs if p['pm2_env']['status'] == 'online'}
          missing = expected - alive
          dead = [(p['name'], p['pm2_env']['status']) for p in procs if p['name'] in expected and p['pm2_env']['status'] != 'online']
          out = list(missing) + [f\"{n}({s})\" for n, s in dead]
          if out:
            print(' '.join(out))
          ")
          if [ -n "$OFFLINE" ]; then
            echo "::error::admin-server not online after restart: $OFFLINE"
            sudo pm2 list
            exit 1
          fi
          echo "admin-server is online."
          PM2_CHECK

      - name: Health check
        id: health_check
        run: |
          echo "Running health check..."
          MAX_RETRIES=10
          RETRY_INTERVAL=5

          for i in $(seq 1 $MAX_RETRIES); do
            echo "Attempt $i/$MAX_RETRIES..."

            HTTP_CODE=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
              "curl -s -o /dev/null -w '%{http_code}' http://localhost:\${ADMIN_PORT:-8446}/admin/api/health" \
              2>/dev/null || echo "000")

            echo "Health check response: HTTP $HTTP_CODE"

            if [ "$HTTP_CODE" = "200" ]; then
              echo "health_status=healthy" >> $GITHUB_OUTPUT
              echo "Health check PASSED"
              exit 0
            fi

            if [ "$i" -lt "$MAX_RETRIES" ]; then
              echo "Retrying in ${RETRY_INTERVAL}s..."
              sleep $RETRY_INTERVAL
            fi
          done

          echo "health_status=unhealthy" >> $GITHUB_OUTPUT
          echo "::error::Health check FAILED after $MAX_RETRIES attempts"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.health_check.outputs.health_status == 'unhealthy'
        run: |
          echo "::error::DEPLOYING ROLLBACK..."
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ROLLBACK_SCRIPT'
          set -e
          cd ${{ secrets.ADMIN_DEPLOY_PATH }}

          ROLLBACK_COMMIT=$(cat /tmp/.admin-portal-rollback-commit 2>/dev/null)
          if [ -z "$ROLLBACK_COMMIT" ]; then
            echo "ERROR: No rollback commit found!"
            exit 1
          fi

          echo "Rolling back to commit: $ROLLBACK_COMMIT"
          git checkout "$ROLLBACK_COMMIT"

          cd server
          npm ci
          npm run build
          npm prune --omit=dev
          sudo pm2 restart ecosystem.config.js

          cd ../client
          npm ci
          npm run deploy

          cd ..
          echo "Rollback complete. Waiting for stabilization..."
          sleep 8
          sudo pm2 list
          ROLLBACK_SCRIPT

      - name: Tag release
        if: success()
        run: |
          VERSION="v$(date +'%Y.%m.%d')-${GITHUB_SHA::7}"
          git tag "$VERSION"
          git push origin "$VERSION"
          echo "Tagged release: $VERSION"

      - name: Create GitHub Release
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const version = `v${new Date().toISOString().slice(0,10).replace(/-/g,'.')}-${context.sha.slice(0,7)}`;
            const commits = await github.rest.repos.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10
            });
            const changelog = commits.data
              .slice(0, 5)
              .map(c => `- ${c.commit.message.split('\n')[0]}`)
              .join('\n');

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: version,
              name: `Admin Portal ${version}`,
              body: `## Deployment\n- **Date**: ${new Date().toISOString()}\n- **Commit**: ${context.sha}\n- **Triggered by**: ${context.actor}\n\n## Recent Changes\n${changelog}`,
              draft: false,
              prerelease: false
            });

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
